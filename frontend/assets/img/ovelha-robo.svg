<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- wool clusters (body) -->
  <g fill="url(#body)">
    <circle cx="128" cy="128" r="52"/>
    <circle cx="86" cy="112" r="30"/>
    <circle cx="170" cy="112" r="30"/>
    <circle cx="96" cy="160" r="28"/>
    <circle cx="160" cy="160" r="28"/>
    <circle cx="128" cy="90" r="26"/>
  </g>

  <!-- circuit lines across the wool -->
  <g stroke="#0A0F1E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35">
    <path d="M96 108 h20 v14 h16"/>
    <path d="M150 106 h-14 v16 h-18"/>
    <path d="M104 150 h18 v-12"/>
    <path d="M150 148 h-16 v-10"/>
  </g>
  <g fill="#0A0F1E" opacity="0.35">
    <circle cx="96" cy="108" r="2.6"/>
    <circle cx="132" cy="122" r="2.6"/>
    <circle cx="150" cy="106" r="2.6"/>
    <circle cx="122" cy="150" r="2.6"/>
  </g>

  <!-- face -->
  <ellipse cx="128" cy="146" rx="30" ry="24" fill="#0F172A"/>
  <circle cx="118" cy="142" r="5.5" fill="url(#bolt)"/>
  <circle cx="138" cy="142" r="5.5" fill="url(#bolt)"/>
  <path d="M120 156 q8 6 16 0" stroke="url(#bolt)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ears -->
  <ellipse cx="100" cy="136" rx="8" ry="12" fill="#0F172A" transform="rotate(-25 100 136)"/>
  <ellipse cx="156" cy="136" rx="8" ry="12" fill="#0F172A" transform="rotate(25 156 136)"/>

  <!-- legs -->
  <g stroke="url(#body)" stroke-width="10" stroke-linecap="round">
    <line x1="102" y1="188" x2="98" y2="208"/>
    <line x1="118" y1="192" x2="116" y2="212"/>
    <line x1="138" y1="192" x2="140" y2="212"/>
    <line x1="154" y1="188" x2="158" y2="208"/>
  </g>

  <!-- electric bolt accent, floating above -->
  <path d="M136 46 L118 78 L132 78 L122 106 L152 70 L136 70 Z" fill="url(#bolt)"/>
</svg>
