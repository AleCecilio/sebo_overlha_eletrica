<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Livro — Sebo Ovelha Elétrica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <a class="navbar-brand" href="../index.html">
    <img src="../assets/img/ovelha-robo.png" alt="Sebo Ovelha Elétrica" class="logo-ovelha">
     <span>Sebo</span> Ovelha Elétrica
  </a>
  <div class="navbar-search">
    <input type="text" id="search-input" placeholder="Buscar livros..." aria-label="Buscar">
    <button onclick="window.location.href='../index.html?q='+document.getElementById('search-input').value"><i class="fa fa-search"></i></button>
  </div>
  <div class="navbar-actions">
    <button class="btn-icon" onclick="window.SeBoApp.toggleDark()" title="Alternar tema"><i class="fa fa-circle-half-stroke"></i></button>
    <button class="btn-icon" onclick="window.SeBoApp.abrirCarrinho()" title="Carrinho">
      <i class="fa fa-bag-shopping"></i>
      <span class="cart-badge" style="display:none">0</span>
    </button>
    <span id="user-info" style="font-size:.85rem;font-weight:600;color:var(--text-secondary)"></span>
    <a id="btn-conta" href="conta.html" class="btn btn-outline" style="display:none;height:36px;padding:0 14px;font-size:.85rem"><i class="fa fa-user-gear"></i> Conta</a>
    <button class="btn btn-primary" id="btn-login" onclick="window.LoginModal.abrir()" style="height:36px;padding:0 16px"><i class="fa fa-right-to-bracket"></i> Entrar</button>
    <button class="btn btn-outline" id="btn-logout" onclick="window.SeBoApp.logout()" style="display:none;height:36px;padding:0 16px"><i class="fa fa-right-from-bracket"></i> Sair</button>
  </div>
</nav>

<!-- ── Breadcrumb ──────────────────────────────────────────────────────────── -->
<div class="breadcrumb-bar">
  <a href="../index.html"><i class="fa fa-arrow-left"></i> Voltar ao catálogo</a>
</div>

<!-- ── Conteúdo ────────────────────────────────────────────────────────────── -->
<main class="container">
  <div id="detalhe-container">
    <div style="text-align:center;padding:80px;color:var(--text-muted)"><i class="fa fa-spinner fa-spin" style="font-size:2rem;margin-bottom:16px;display:block"></i>Carregando...</div>
  </div>
</main>

<!-- ── Carrinho Lateral ────────────────────────────────────────────────────── -->
<aside class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <span>Meu Carrinho</span>
    <button class="btn-icon" onclick="window.SeBoApp.fecharCarrinho()"><i class="fa fa-xmark"></i></button>
  </div>
  <div class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span>R$ 0,00</span>
    </div>
    <button class="btn btn-success" style="width:100%" onclick="window.Checkout.abrir()">
      <i class="fa fa-lock"></i> Finalizar Compra
    </button>
  </div>
</aside>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/login.js"></script>
<script src="../assets/js/checkout.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const livroId = params.get('id');

  async function carregarDetalhes() {
    const container = document.getElementById('detalhe-container');
    if (!livroId) {
      container.innerHTML = `<div class="empty-state"><div class="icon"><i class="fa fa-question-circle"></i></div><h3>Livro não especificado.</h3><a class="btn btn-primary" href="../index.html">Voltar</a></div>`;
      return;
    }

    try {
      const data = await window.SeBoApp.apiFetch(`/buscar/${livroId}`);
      const l = data.livro;

      document.title = `${l.titulo} — Sebo Online`;

      const badgeClass = {
        'Novo': 'novo', 'Ótimo': 'otimo', 'Bom': 'bom',
        'Regular': 'regular', 'Com Defeito': 'defeito'
      }[l.conservacao] || 'bom';

      const metaItems = [
        l.genero       ? `<span class="meta-chip"><i class="fa fa-tag"></i> ${l.genero}</span>` : '',
        l.ano_publicacao ? `<span class="meta-chip"><i class="fa fa-calendar"></i> ${l.ano_publicacao}</span>` : '',
        l.editora      ? `<span class="meta-chip"><i class="fa fa-building"></i> ${l.editora}</span>` : '',
        l.isbn         ? `<span class="meta-chip"><i class="fa fa-barcode"></i> ISBN ${l.isbn}</span>` : '',
      ].filter(Boolean).join('');

      container.innerHTML = `
        <div class="detail-page">
          <div>
            <div class="detail-cover">
              ${l.imagem_url
                ? `<img src="${l.imagem_url}" alt="${l.titulo}" class="capa-livro">`
                : `<div style="aspect-ratio:2/3;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--text-muted)"><i class="fa fa-book"></i></div>`}
            </div>
            <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn btn-primary" style="flex:1" onclick="addCarrinho()" ${l.estoque === 0 ? 'disabled' : ''}>
                <i class="fa fa-plus"></i> ${l.estoque === 0 ? 'Indisponível' : 'Adicionar ao Carrinho'}
              </button>
            </div>
          </div>

          <div class="detail-info">
            ${l.genero ? `<div class="detail-genre">${l.genero}</div>` : ''}
            <h1 class="detail-title">${l.titulo}</h1>
            <div class="detail-author">por <strong>${l.autor}</strong></div>

            <div class="detail-meta">
              <span class="conservacao-badge ${badgeClass}" style="position:static;font-size:.78rem">
                ${l.conservacao}
              </span>
              ${metaItems}
            </div>

            <div class="detail-price">R$ ${parseFloat(l.preco).toFixed(2).replace('.',',')}</div>
            <div class="detail-estoque">
              ${l.estoque > 0
                ? `<i class="fa fa-circle-check" style="color:var(--success)"></i> ${l.estoque} exemplar(es) disponível(is)`
                : `<i class="fa fa-circle-xmark" style="color:var(--danger)"></i> Indisponível (sem estoque)`}
            </div>

            ${l.sinopse ? `
              <div style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px">Sinopse</div>
              <p class="detail-sinopse">${l.sinopse}</p>
            ` : ''}

            ${l.estoque > 0 ? `
              <div class="qty-stepper" style="margin-bottom:16px">
                <button type="button" onclick="ajustarQtd(-1)"><i class="fa fa-minus"></i></button>
                <input type="number" id="qtd-input" min="1" max="${l.estoque}" value="1">
                <button type="button" onclick="ajustarQtd(1)"><i class="fa fa-plus"></i></button>
              </div>
            ` : ''}

            <div class="detail-actions">
              <button class="btn btn-primary" onclick="addCarrinho()" ${l.estoque === 0 ? 'disabled' : ''}>
                <i class="fa fa-cart-plus"></i> ${l.estoque === 0 ? 'Indisponível' : 'Adicionar ao Carrinho'}
              </button>
              <button class="btn btn-outline" onclick="window.history.back()">
                <i class="fa fa-arrow-left"></i> Voltar
              </button>
            </div>
          </div>
        </div>

        <!-- ── Comentários e Avaliações (PARTE 9) ─────────────────────────── -->
        <div class="conta-secao" style="margin-top:32px">
          <h2 class="section-title" style="margin-bottom:16px">Avaliações e Comentários</h2>

          <div id="avaliacao-resumo" style="margin-bottom:20px;color:var(--text-secondary)"></div>

          <div id="form-avaliacao" style="margin-bottom:24px"></div>

          <div id="lista-comentarios"></div>
        </div>`;

      window._livroAtual = l;
      carregarComentarios();

    } catch (e) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon"><i class="fa fa-triangle-exclamation"></i></div>
          <h3>Livro não encontrado</h3>
          <p>${e.mensagem || 'Verifique se o servidor está online.'}</p>
          <br><a class="btn btn-primary" href="../index.html">Voltar ao catálogo</a>
        </div>`;
    }
  }

  function ajustarQtd(delta) {
    const input = document.getElementById('qtd-input');
    if (!input) return;
    const max = parseInt(input.max) || 99;
    let val = (parseInt(input.value) || 1) + delta;
    val = Math.max(1, Math.min(val, max));
    input.value = val;
  }

  function addCarrinho() {
    if (window._livroAtual) {
      const input = document.getElementById('qtd-input');
      const quantidade = input ? (parseInt(input.value) || 1) : 1;
      window.SeBoApp.adicionarAoCarrinho(window._livroAtual, quantidade);
      window.SeBoApp.abrirCarrinho();
    }
  }

  // ── Comentários e Avaliações (PARTE 9) ──────────────────────────────────
  async function carregarComentarios() {
    if (!livroId) return;
    try {
      const data = await window.SeBoApp.apiFetch(`/livros/${livroId}/comentarios`);
      renderizarResumoAvaliacao(data.total, data.media);
      renderizarFormAvaliacao();
      renderizarComentarios(data.comentarios, data.total);
    } catch (_e) {
      document.getElementById('avaliacao-resumo').innerHTML = '<p style="color:var(--text-muted)">Não foi possível carregar as avaliações.</p>';
    }
  }

  function renderizarResumoAvaliacao(total, media) {
    const el = document.getElementById('avaliacao-resumo');
    if (!total) { el.innerHTML = '<p>Este livro ainda não tem avaliações. Seja o primeiro a avaliar!</p>'; return; }
    const estrelasCheias = Math.round(media);
    const estrelas = Array.from({ length: 5 }, (_, i) =>
      `<i class="${i < estrelasCheias ? 'fas' : 'far'} fa-star"></i>`).join('');
    el.innerHTML = `
      <span class="star-rating">${estrelas}</span>
      <strong style="margin-left:6px">${media.toFixed(1)}</strong>
      <span style="margin-left:6px">(${total} ${total === 1 ? 'avaliação' : 'avaliações'})</span>`;
  }

  function renderizarFormAvaliacao() {
    const container = document.getElementById('form-avaliacao');
    const usuario = window.SeBoApp.state.usuario;

    if (!usuario) {
      container.innerHTML = `<p style="color:var(--text-secondary)">
        <a href="#" onclick="window.LoginModal.abrir(); return false;">Faça login</a> para comentar e avaliar este livro.
      </p>`;
      return;
    }

    container.innerHTML = `
      <div class="form-group">
        <label>Sua avaliação</label>
        <div class="star-rating-input" id="estrelas-input">
          ${[1,2,3,4,5].map(n => `<i class="far fa-star" data-nota="${n}" onclick="selecionarNota(${n})"></i>`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label>Comentário</label>
        <textarea id="comentario-texto" class="form-control" rows="3" placeholder="O que você achou deste livro?"></textarea>
      </div>
      <button class="btn btn-primary" onclick="enviarAvaliacao()"><i class="fa fa-paper-plane"></i> Enviar avaliação</button>
    `;
  }

  let _notaSelecionada = 0;
  function selecionarNota(n) {
    _notaSelecionada = n;
    document.querySelectorAll('#estrelas-input i').forEach(el => {
      const ativa = parseInt(el.dataset.nota) <= n;
      el.className = ativa ? 'fas fa-star ativa' : 'far fa-star';
    });
  }

  async function enviarAvaliacao() {
    const comentario = document.getElementById('comentario-texto').value.trim();
    if (!_notaSelecionada) { window.SeBoApp.toast('Selecione uma nota de 1 a 5 estrelas.', 'error'); return; }
    if (!comentario) { window.SeBoApp.toast('Escreva um comentário.', 'error'); return; }

    try {
      await window.SeBoApp.apiFetch(`/livros/${livroId}/comentarios`, {
        method: 'POST',
        body: JSON.stringify({ nota: _notaSelecionada, comentario }),
      });
      window.SeBoApp.toast('Avaliação enviada com sucesso!', 'success');
      carregarComentarios();
    } catch (e) {
      window.SeBoApp.toast(e.mensagem || 'Erro ao enviar avaliação.', 'error');
    }
  }

  function renderizarComentarios(comentarios, total) {
    const lista = document.getElementById('lista-comentarios');
    if (!comentarios || comentarios.length === 0) {
      lista.innerHTML = '';
      return;
    }

    const aviso = total > 10
      ? `<p style="font-size:.8rem;color:var(--text-muted);margin-bottom:12px">Mostrando os 5 comentários mais recentes de ${total}.</p>`
      : '';

    lista.innerHTML = aviso + comentarios.map(c => {
      const data = new Date(c.criado_em).toLocaleDateString('pt-BR');
      const estrelas = Array.from({ length: 5 }, (_, i) =>
        `<i class="${i < c.nota ? 'fas' : 'far'} fa-star"></i>`).join('');
      return `
        <div class="comentario-card">
          <div class="comentario-header">
            <span class="comentario-autor">${c.usuario_nome}</span>
            <span class="comentario-data">${data}</span>
          </div>
          <span class="star-rating" style="font-size:.85rem;margin-bottom:6px;display:inline-block">${estrelas}</span>
          <p>${c.comentario}</p>
        </div>`;
    }).join('');
  }

  window.SeBoApp.atualizarBadgeCarrinho();
  window.SeBoApp.atualizarUIAuth();
  carregarDetalhes();
</script>
</body>
</html>
