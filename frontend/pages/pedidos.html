<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Pedidos — Sebo Ovelha Elétrica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────────── -->
<!-- ── Navbar (padronizada em todas as páginas, menu sanduíche + Bootstrap Offcanvas) ── -->
<nav class="navbar sebo-navbar">
  <button class="navbar-toggler-custom" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menu">
    <i class="fa fa-bars"></i>
  </button>

  <a class="navbar-brand" href="../index.html">
    <img src="../assets/img/ovelha-robo.png" alt="Sebo Ovelha Elétrica" class="logo-ovelha">
     <span>Sebo</span> Ovelha Elétrica
  </a>

  <div class="navbar-search">
    <input type="text" id="search-input" placeholder="Buscar por título, autor ou ISBN..." aria-label="Buscar livros">
    <button onclick="window.location.href='../index.html'" aria-label="Pesquisar"><i class="fa fa-search"></i></button>
  </div>

  <div class="navbar-actions">
    <button class="btn-icon" onclick="window.SeBoApp.toggleDark()" title="Alternar tema"><i class="fa fa-circle-half-stroke"></i></button>
    <button class="btn-icon" onclick="window.SeBoApp.abrirCarrinho()" title="Carrinho" aria-label="Abrir carrinho">
      <i class="fa fa-bag-shopping"></i>
      <span class="cart-badge" style="display:none">0</span>
    </button>
  </div>
</nav>

<!-- ── Menu Sanduíche (Offcanvas) — mesmo menu em todas as páginas ── -->
<div class="offcanvas offcanvas-start sebo-offcanvas" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="menuLateralLabel">
      <img src="../assets/img/ovelha-robo.png" alt="" class="logo-ovelha" style="width:26px;height:26px"> Menu
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">

    <div id="menu-perfil-box" class="menu-perfil-box d-none">
      <span class="menu-perfil-icone"><i class="fa fa-circle-user"></i></span>
      <div>
        <div id="user-info" class="menu-perfil-nome"></div>
        <span id="badge-admin" class="admin-pill d-none"><i class="fa fa-shield-halved"></i> ADMIN</span>
      </div>
    </div>

    <nav class="menu-links">
      <a href="../index.html" class="menu-link"><i class="fa fa-house"></i> Início</a>
      <a id="btn-pedidos" href="pedidos.html" class="menu-link d-none"><i class="fa fa-box-open"></i> Meus Pedidos</a>
      <a id="btn-conta" href="conta.html" class="menu-link d-none"><i class="fa fa-user-gear"></i> Minha Conta</a>
      <a id="btn-admin" href="admin.html" class="menu-link d-none"><i class="fa fa-sliders"></i> Painel Admin</a>
    </nav>

    <div class="mt-auto pt-3">
      <button id="btn-login" class="btn btn-primary w-100" onclick="window.LoginModal.abrir()">
        <i class="fa fa-right-to-bracket"></i> Entrar
      </button>
      <button id="btn-logout" class="btn btn-outline w-100 d-none" onclick="window.SeBoApp.logout(); window.location='../index.html'">
        <i class="fa fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </div>
</div>

<!-- ── Conteúdo ────────────────────────────────────────────────────────────── -->
<main class="container">
  <div class="page-header">
    <h1><i class="fa fa-box-open" style="color:var(--primary);margin-right:10px"></i> Meus Pedidos</h1>
    <a href="../index.html" class="btn btn-outline"><i class="fa fa-arrow-left"></i> Continuar comprando</a>
  </div>
  <div id="pedidos-container">
    <div style="text-align:center;padding:64px;color:var(--text-muted)"><i class="fa fa-spinner fa-spin" style="font-size:1.8rem;margin-bottom:16px;display:block"></i>Carregando pedidos...</div>
  </div>
</main>

<!-- ── Carrinho Lateral ────────────────────────────────────────────────────── -->
<aside class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <span>Meu Carrinho</span>
    <button class="btn-icon" onclick="window.SeBoApp.fecharCarrinho()"><i class="fa fa-xmark"></i></button>
  </div>
  <div class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total"><span>Total</span><span>R$ 0,00</span></div>
    <button class="btn btn-success" style="width:100%" onclick="window.Checkout.abrir()"><i class="fa fa-lock"></i> Finalizar Compra</button>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/login.js"></script>
<script src="../assets/js/checkout.js"></script>
<script>
  const ICONES_STATUS = {
    PAGO: '<i class="fa fa-circle-check"></i>',
    PENDENTE: '<i class="fa fa-clock"></i>',
    ENVIADO: '<i class="fa fa-truck"></i>',
    ENTREGUE: '<i class="fa fa-house-circle-check"></i>',
    CANCELADO: '<i class="fa fa-circle-xmark"></i>'
  };
  const ICONES_PGTO = {
    PIX: '<i class="fa fa-qrcode"></i>',
    CARTAO: '<i class="fa fa-credit-card"></i>'
  };

  async function carregarPedidos() {
    const container = document.getElementById('pedidos-container');

    if (!window.SeBoApp.state.usuario) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon"><i class="fa fa-lock"></i></div>
          <h3>Acesso restrito</h3>
          <p>Faça login para visualizar seus pedidos.</p>
          <br>
          <button class="btn btn-primary" onclick="window.LoginModal.abrir()"><i class="fa fa-right-to-bracket"></i> Fazer Login</button>
        </div>`;
      return;
    }

    try {
      const data = await window.SeBoApp.apiFetch('/pedidos/meus');

      if (!data.pedidos || data.pedidos.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon"><i class="fa fa-box-open"></i></div>
            <h3>Nenhum pedido ainda</h3>
            <p>Você ainda não realizou nenhuma compra.</p>
            <br>
            <a href="../index.html" class="btn btn-primary"><i class="fa fa-book"></i> Ver Catálogo</a>
          </div>`;
        return;
      }

      container.innerHTML = data.pedidos.map(p => {
        const data_fmt = new Date(p.criado_em).toLocaleDateString('pt-BR', {
          day: '2-digit', month: 'long', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        const livrosArr = p.livros ? p.livros.split(' | ') : [];

        return `
          <div class="pedido-card">
            <div class="pedido-header">
              <div class="pedido-id">Pedido #${p.id}</div>
              <span class="status-badge status-${p.status}">
                ${ICONES_STATUS[p.status] || ''} ${p.status}
              </span>
            </div>
            <div class="pedido-meta">
              <span><i class="fa fa-calendar-alt"></i> <strong>${data_fmt}</strong></span>
              <span>${ICONES_PGTO[p.forma_pagamento] || ''} <strong>${p.forma_pagamento}</strong></span>
              <span class="pedido-total">R$ ${parseFloat(p.total).toFixed(2).replace('.',',')}</span>
            </div>
            <div class="pedido-livros">
              <strong><i class="fa fa-books"></i> Livros:</strong><br>
              ${livrosArr.map(l => `• ${l.trim()}`).join('<br>')}
            </div>
          </div>`;
      }).join('');

    } catch (e) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon"><i class="fa fa-triangle-exclamation"></i></div>
          <h3>Erro ao carregar pedidos</h3>
          <p>${e.mensagem || 'Verifique se o servidor está online.'}</p>
        </div>`;
    }
  }

  window.SeBoApp.atualizarBadgeCarrinho();
  window.SeBoApp.atualizarUIAuth();
  carregarPedidos();
</script>
</body>
</html>
