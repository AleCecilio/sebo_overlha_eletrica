<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sebo Ovelha Elétrica — Livros Usados com História</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="description" content="Sebo Online: encontre livros usados com ótimo estado de conservação a preços acessíveis.">
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────────── -->
<!-- ── Navbar (padronizada em todas as páginas, menu sanduíche + Bootstrap Offcanvas) ── -->
<nav class="navbar sebo-navbar">
  <button class="navbar-toggler-custom" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menu">
    <i class="fa fa-bars"></i>
  </button>

  <a class="navbar-brand" href="index.html">
    <img src="assets/img/ovelha-robo.png" alt="Sebo Ovelha Elétrica" class="logo-ovelha">
     <span>Sebo</span> Ovelha Elétrica
  </a>

  <div class="navbar-search">
    <input type="text" id="search-input" placeholder="Buscar por título, autor ou ISBN..." aria-label="Buscar livros">
    <button onclick="buscar()" aria-label="Pesquisar"><i class="fa fa-search"></i></button>
  </div>

  <div class="navbar-actions">
    <button class="btn-icon" onclick="window.SeBoApp.toggleDark()" title="Alternar tema"><i class="fa fa-circle-half-stroke"></i></button>
    <button class="btn-icon" onclick="window.SeBoApp.abrirCarrinho()" title="Carrinho" aria-label="Abrir carrinho">
      <i class="fa fa-bag-shopping"></i>
      <span class="cart-badge" style="display:none">0</span>
    </button>
  </div>
</nav>

<!-- ── Menu Sanduíche (Offcanvas) — mesmo menu em todas as páginas ── -->
<div class="offcanvas offcanvas-start sebo-offcanvas" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="menuLateralLabel">
      <img src="assets/img/ovelha-robo.png" alt="" class="logo-ovelha" style="width:26px;height:26px"> Menu
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">

    <div id="menu-perfil-box" class="menu-perfil-box d-none">
      <span class="menu-perfil-icone"><i class="fa fa-circle-user"></i></span>
      <div>
        <div id="user-info" class="menu-perfil-nome"></div>
        <span id="badge-admin" class="admin-pill d-none"><i class="fa fa-shield-halved"></i> ADMIN</span>
      </div>
    </div>

    <nav class="menu-links">
      <a href="index.html" class="menu-link"><i class="fa fa-house"></i> Início</a>
      <a id="btn-pedidos" href="pages/pedidos.html" class="menu-link d-none"><i class="fa fa-box-open"></i> Meus Pedidos</a>
      <a id="btn-conta" href="pages/conta.html" class="menu-link d-none"><i class="fa fa-user-gear"></i> Minha Conta</a>
      <a id="btn-admin" href="pages/admin.html" class="menu-link d-none"><i class="fa fa-sliders"></i> Painel Admin</a>
    </nav>

    <div class="mt-auto pt-3">
      <button id="btn-login" class="btn btn-primary w-100" onclick="window.LoginModal.abrir()">
        <i class="fa fa-right-to-bracket"></i> Entrar
      </button>
      <button id="btn-logout" class="btn btn-outline w-100 d-none" onclick="window.SeBoApp.logout(); window.location='index.html'">
        <i class="fa fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </div>
</div>

<!-- ── Hero ───────────────────────────────────────────────────────────────── -->
<section class="hero">
  <h1>Livros com <em>história</em>,<br>preços que fazem sentido.</h1>
  <p>Encontre títulos usados em ótimo estado. Cada livro tem uma nova jornada pela frente.</p>
</section>

<!-- ── Filtros ─────────────────────────────────────────────────────────────── -->
<div class="filters-bar">
  <label>Filtrar por:</label>
  <select id="filtro-genero" onchange="aplicarFiltros()">
    <option value="">Todos os Gêneros</option>
    <!-- opções preenchidas dinamicamente via GET /generos (ver carregarGeneros) -->
  </select>

  <select id="filtro-conservacao" onchange="aplicarFiltros()">
    <option value="">Qualquer Estado</option>
    <option value="Novo">Novo</option>
    <option value="Ótimo">Ótimo</option>
    <option value="Bom">Bom</option>
    <option value="Regular">Regular</option>
    <option value="Com Defeito">Com Defeito</option>
  </select>
</div>

<!-- ── Catálogo ────────────────────────────────────────────────────────────── -->
<main class="container">
  <h2 class="section-title">Catálogo</h2>
  <div class="books-grid" id="books-grid">
    <!-- preenchido via JS -->
  </div>
  <div class="pagination" id="pagination"></div>
</main>

<!-- ── Carrinho Lateral ────────────────────────────────────────────────────── -->
<aside class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <span>Meu Carrinho</span>
    <button class="btn-icon" onclick="window.SeBoApp.fecharCarrinho()"><i class="fa fa-xmark"></i></button>
  </div>
  <div class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span>R$ 0,00</span>
    </div>
    <button class="btn btn-success" style="width:100%" onclick="window.Checkout.abrir()">
      <i class="fa fa-lock"></i> Finalizar Compra
    </button>
  </div>
</aside>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/login.js"></script>
<script src="assets/js/checkout.js"></script>
<script>
  // ── Estado de paginação / filtros ──────────────────────────────────────
  let paginaAtual = 1;
  const LIMITE = 12;

  // ── Carrega gêneros reais do catálogo para o filtro (PARTE 1) ───────────
  async function carregarGeneros() {
    try {
      const data   = await window.SeBoApp.apiFetch('/generos');
      const select = document.getElementById('filtro-genero');
      (data.generos || []).forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        select.appendChild(opt);
      });
    } catch (_e) { /* mantém apenas "Todos os Gêneros" em caso de falha */ }
  }

  // ── Carrega livros ─────────────────────────────────────────────────────
  async function carregarLivros(pagina = 1) {
    paginaAtual = pagina;
    const busca       = document.getElementById('search-input').value.trim();
    const genero      = document.getElementById('filtro-genero').value;
    const conservacao = document.getElementById('filtro-conservacao').value;

    const params = new URLSearchParams({ pagina, limite: LIMITE });
    if (busca)       params.set('busca', busca);
    if (genero)      params.set('genero', genero);
    if (conservacao) params.set('conservacao', conservacao);

    const grid = document.getElementById('books-grid');
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text-muted)"><i class="fa fa-spinner fa-spin" style="font-size:1.5rem;margin-bottom:12px;display:block"></i>Carregando...</div>';

    try {
      const data = await window.SeBoApp.apiFetch(`/listar?${params}`);
      renderizarGrid(data.livros);
      renderizarPaginacao(data.paginas, data.pagina);
    } catch (e) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="icon"><i class="fa fa-plug-circle-xmark"></i></div>
          <h3>Servidor offline</h3>
          <p>Verifique se o back-end está rodando em <code>localhost:3000</code></p>
        </div>`;
    }
  }

  function renderizarGrid(livros) {
    const grid = document.getElementById('books-grid');
    if (!livros || livros.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="icon"><i class="fa fa-book-open"></i></div>
          <h3>Nenhum livro encontrado</h3>
          <p>Tente outros termos de busca ou remova os filtros.</p>
        </div>`;
      return;
    }

    grid.innerHTML = livros.map(l => {
      const badgeClass = {
        'Novo': 'novo', 'Ótimo': 'otimo', 'Bom': 'bom',
        'Regular': 'regular', 'Com Defeito': 'defeito'
      }[l.conservacao] || 'bom';

      const indisponivel = Number(l.estoque) <= 0;

      return `
        <article class="book-card ${indisponivel ? 'indisponivel' : ''}" onclick="verDetalhes(${l.id})">
          <div class="book-cover">
            ${l.imagem_url
              ? `<img src="${l.imagem_url}" alt="${l.titulo}" class="capa-livro" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''}
            <div class="no-cover" ${l.imagem_url ? 'style="display:none"' : ''}>
              <span class="icon"><i class="fa fa-book"></i></span>
              <span>Sem capa</span>
            </div>
            ${indisponivel ? '<div class="indisponivel-overlay">Indisponível</div>' : ''}
            <span class="conservacao-badge ${badgeClass}">${l.conservacao}</span>
          </div>
          <div class="book-info">
            <div class="book-title">${l.titulo}</div>
            <div class="book-author">${l.autor}</div>
            <div class="book-price">R$ ${parseFloat(l.preco).toFixed(2).replace('.',',')}</div>
            <button class="btn-add-cart" ${indisponivel ? 'disabled' : ''}
              onclick="event.stopPropagation(); adicionarCarrinho(${l.id}, '${encodeURIComponent(JSON.stringify(l))}')">
              <i class="fa fa-plus"></i> ${indisponivel ? 'Indisponível' : 'Adicionar'}
            </button>
          </div>
        </article>`;
    }).join('');
  }

  function renderizarPaginacao(totalPaginas, paginaAtualNum) {
    const container = document.getElementById('pagination');
    if (totalPaginas <= 1) { container.innerHTML = ''; return; }

    let html = '';
    if (paginaAtualNum > 1) html += `<button onclick="carregarLivros(${paginaAtualNum - 1})"><i class="fa fa-chevron-left"></i></button>`;
    for (let i = 1; i <= totalPaginas; i++) {
      html += `<button onclick="carregarLivros(${i})" class="${i === paginaAtualNum ? 'active' : ''}">${i}</button>`;
    }
    if (paginaAtualNum < totalPaginas) html += `<button onclick="carregarLivros(${paginaAtualNum + 1})"><i class="fa fa-chevron-right"></i></button>`;
    container.innerHTML = html;
  }

  // ── Ações ──────────────────────────────────────────────────────────────
  function buscar() {
    carregarLivros(1);
  }

  function aplicarFiltros() {
    carregarLivros(1);
  }

  function verDetalhes(id) {
    window.location.href = `pages/detalhes.html?id=${id}`;
  }

  function adicionarCarrinho(id, livroEncoded) {
    const livro = JSON.parse(decodeURIComponent(livroEncoded));
    window.SeBoApp.adicionarAoCarrinho(livro);
  }

  // ── Enter para buscar ──────────────────────────────────────────────────
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') buscar();
  });

  // ── Inicialização ──────────────────────────────────────────────────────
  window.SeBoApp.atualizarBadgeCarrinho();
  window.SeBoApp.atualizarUIAuth();
  carregarGeneros();
  carregarLivros();
</script>
</body>
</html>
